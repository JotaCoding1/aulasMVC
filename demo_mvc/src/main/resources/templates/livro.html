<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Livro</title>
</head>
<body>
  <h1 th:if="${indice == null}" th:text="${livro.titulo}"></h1>
  <div th:if="${indice != null}">
    <h1>Editar livro</h1>
    <form th:action="@{/livros/editar/{indice}(indice=${indice})}" method="post">
      <label>Titulo:
        <input type="text" name="titulo" th:value="${livro.titulo}" required>
      </label>
      <label>Autor:
        <input type="text" name="autor" th:value="${livro.autor}" required>
      </label>
      <label>ISBN:
        <input type="text" name="isbn" th:value="${livro.isbn}" required>
      </label>
      <button type="submit">Salvar</button>
    </form>
  </div>
  <div th:if="${indice == null}">
    <p>Autor: <span th:text="${livro.autor}"></span></p>
    <p>ISBN: <span th:text="${livro.isbn}"></span></p>
  </div>
  <a th:href="@{/livros}">Voltar</a>
</body>
</html>
