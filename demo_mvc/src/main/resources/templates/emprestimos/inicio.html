<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <title>Empréstimos</title>
</head>
<body>
  <h1>Empréstimos</h1>

  <form th:action="@{/emprestimos}" method="post">
    <label>Data do empréstimo:
      <input type="text" name="dataEmprestimo" required>
    </label>
    <label>Data de devolução:
      <input type="text" name="dataDevolucao" required>
    </label>
    <label>Status:
      <input type="text" name="status" required>
    </label>
    <button type="submit">Cadastrar</button>
  </form>

  <h2>Lista de empréstimos</h2>
  <p th:if="${#lists.isEmpty(emprestimos)}">Nenhum empréstimo cadastrado.</p>
  <ul th:if="${!#lists.isEmpty(emprestimos)}">
    <li th:each="emprestimo, status : ${emprestimos}">
      Empréstimo: <span th:text="${emprestimo.dataEmprestimo}"></span>
      - Devolução: <span th:text="${emprestimo.dataDevolucao}"></span>
      (Status: <span th:text="${emprestimo.status}"></span>)
      <a th:href="@{/emprestimos/editar/{indice}(indice=${status.index})}">Editar</a>
      <form th:action="@{/emprestimos/excluir/{indice}(indice=${status.index})}"
            method="post" style="display:inline">
        <button type="submit">Excluir</button>
      </form>
    </li>
  </ul>

  <nav>
    <a th:href="@{/}">Voltar</a>
  </nav>
</body>
</html>
